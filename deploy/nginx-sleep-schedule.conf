# 作息安排系统 —— nginx 站点配置
#
#   http://<host>/            -> 302 到 /user/
#   http://<host>/user/       -> 用户端（登录 / 睡眠记录 / 作息建议 / 个人设置）
#   http://<host>/admin/      -> 管理后台（仅 PC）
#   http://<host>/shared/     -> 前后端共用的样式与 ES 模块
#   http://<host>/api/        -> FastAPI（127.0.0.1:8011）
#   http://<host>/healthz     -> 健康检查
#
# 这套路径与后端自带的静态目录完全一致（后端也是把 /shared、/user、/admin 挂载
# 到 frontend/ 下的同名目录），因此同一份前端代码用 python run.py 直接跑和用
# nginx 跑，地址完全一样。
#
# 踩坑记录（改这个文件前先看）
# 1) 页面里的资源地址一律写成“站点绝对路径”（/shared/...、/user/css/...）。
#    不要用 ../ 跨目录：浏览器会先把 ../ 规范化掉，/user/js/pages/x.js 里的
#    ../../shared/y.js 会变成 /shared/y.js 而丢掉 /user 前缀，一旦站点不在域名
#    根上（例如挂在 /sleep/ 下）就会整站 404、界面空白。
#    注意：ES 模块的 import 说明符是相对“模块自身的 URL”解析的，跟页面地址无关，
#    /user/js/main.js 里的 ../shared/api.js 会变成 /user/shared/api.js（这个路径
#    在 nginx 和后端两种布局下都不存在）。前端所有跨目录 import 都已改成 /shared/...，
#    由 scripts/absolute_shared_imports.py 维护（可重复执行、幂等）。
# 2) 只用 root，不要用 alias 配 try_files：alias 不会重映射 $uri，实测
#    （nginx 1.24/1.26）会造成目录 404 或静态请求落到 SPA 兜底。
# 3) root 指到 /var/www/sleep-schedule，那么 URL /user/css/app.css 对应的就是
#    /var/www/sleep-schedule/user/css/app.css —— 部署脚本就是按这个结构发布的。
# 4) 老的 /sleep/... 地址全部 302 到新地址，避免已发出去的书签失效。
# 5) 静态资源缺失必须 404：不能让它落到 SPA 兜底，否则缺失的 .js 会以 200 +
#    text/html 返回，浏览器只报 MIME 类型错误，极难定位。
#
# 安装：
#   sudo cp deploy/nginx-sleep-schedule.conf /etc/nginx/sites-available/sleep-schedule
#   sudo ln -sf /etc/nginx/sites-available/sleep-schedule /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# 域名与 HTTPS（yiuki.me，2026-10 加入）
#   域名 yiuki.me / www.yiuki.me 解析到本机，但服务器在阿里云境内，
#   备案（ICP）没通过前阿里云会按 Host 直接拦成 403 Non-compliance ICP Filing，
#   请求根本到不了 nginx；这一步只能等备案，改配置没用。
#   HTTPS 用 certbot（Let's Encrypt）：
#     sudo certbot certonly --webroot -w /var/www/certbot -d yiuki.me -d www.yiuki.me \
#          --deploy-hook "systemctl reload nginx"
#   证书就位后跑 deploy/enable-tls.sh，把下面带 #TLS# 的行放开（443 监听、证书
#   路径、域名跳 HTTPS、www 跳裸域），再 nginx -t && reload。
#   为什么不能现在就开 443：ssl_certificate 指向的文件不存在时 nginx -t 直接失败，
#   reload 会被拒，站点跟着挂。

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    #TLS# listen 443 ssl http2;
    #TLS# listen [::]:443 ssl http2;
    #TLS# ssl_certificate     /etc/letsencrypt/live/yiuki.me/fullchain.pem;
    #TLS# ssl_certificate_key /etc/letsencrypt/live/yiuki.me/privkey.pem;
    server_name _ yiuki.me www.yiuki.me;

    # 域名统一走 https://yiuki.me；IP 直连（$host 是 IP）不受影响，留作备用入口。
    #TLS# if ($host = yiuki.me) { return 301 https://yiuki.me$request_uri; }
    #TLS# if ($host = www.yiuki.me) { return 301 https://yiuki.me$request_uri; }

    # 静态站点根：/var/www/sleep-schedule/{user,admin,shared} 由部署脚本发布。
    root /var/www/sleep-schedule;
    index index.html;

    charset utf-8;
    server_tokens off;

    # ------------------------------------------------------- ACME 验证 ------
    # certbot --webroot 把验证文件写进 /var/www/certbot，续期（每 60 天左右）
    # 会自动再走一遍这个路径，所以这条 location 必须常驻。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
        access_log off;
    }

    # ------------------------------------------------------------- 压缩 ------
    # 首屏要下 12 个 ES 模块，不压缩时共 214.6KB：链路 RTT≈40ms 时，光下载就要 200ms+，
    # 比“接口那 40ms”更能被肉眼看见。开 gzip 后同样这批模块只剩 ~55KB。
    # gzip_types 里 text/javascript 与 application/javascript 两种都写：不同 nginx 版本的
    # mime.types 给 .js 的 Content-Type 不一样，漏一个就压不到（表现为“配了却没效果”）。
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               image/svg+xml;

    # ------------------------------------------------------------------ API --
    location /api/ {
        proxy_pass http://127.0.0.1:8011/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 1m;
        add_header Cache-Control "no-store" always;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8011/healthz;
        proxy_set_header Host $host;
        access_log off;
    }

    # ------------------------------------------------------- 旧地址兼容 -------
    # 早期版本挂在 /sleep/ 下，这些地址全部收敛到新地址。
    location = /sleep {
        return 302 /user/;
    }

    location = /sleep/ {
        return 302 /user/;
    }

    location /sleep/user/ {
        return 302 /user/;
    }

    location = /sleep/admin {
        return 302 /admin/;
    }

    location /sleep/admin/ {
        return 302 /admin/;
    }

    location /sleep/api/ {
        proxy_pass http://127.0.0.1:8011/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 1m;
        add_header Cache-Control "no-store" always;
    }

    location = /sleep/shared {
        return 302 /shared/;
    }

    location /sleep/shared/ {
        return 302 /shared/;
    }

    location = /sleep/healthz {
        proxy_pass http://127.0.0.1:8011/healthz;
        access_log off;
    }

    location /sleep/ {
        return 302 /user/;
    }

    # ------------------------------------------------------- 静态资源 ---------
    # 缺失的静态资源一律 404，绝不落到 SPA 兜底。
    #
    # 为什么单独写这一条：SPA 兜底会把不存在的 .js 当成“未知路径”返回首页 HTML，
    # 而且状态码是 200。浏览器只会报 “Expected a JavaScript module script but the
    # server responded with a MIME type of text/html”，从 Network 面板上完全看不出
    # 是 404 —— 2024 年那次“界面只剩背景”的问题就卡在这里查了很久。
    # 正则 location 的优先级高于普通前缀 location，所以 /user/css/app.css、
    # /admin/js/app.js、/shared/base.css 都会先走这里。
    location ~* ^/(?:user|admin|shared)/.+\.(?:js|mjs|css|map|json|svg|png|jpe?g|gif|webp|ico|woff2?|ttf|eot)$ {
        root /var/www/sleep-schedule;
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # 目录名与 URL 前缀一一对应，root 直接拼接即可命中原文件。
    location /shared/ {
        root /var/www/sleep-schedule;
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # 旧版本模块用的是相对自身的 ../shared/...，浏览器会把它解析成
    # /user/shared/... 或 /admin/shared/...。这里指回真正的 /shared/，
    # 这样即使浏览器还缓存着修复前的旧模块，页面也能正常加载。
    # 必须用 ^~，否则会被上面的静态资源正则抢走。
    location ^~ /user/shared/ {
        alias /var/www/sleep-schedule/shared/;
        add_header Cache-Control "no-cache" always;
    }

    location ^~ /admin/shared/ {
        alias /var/www/sleep-schedule/shared/;
        add_header Cache-Control "no-cache" always;
    }

    # 管理端页面里的 ./css、./js 会请求 /admin/css/、/admin/js/。
    location /admin/ {
        try_files $uri $uri/index.html $uri/ /admin/index.html;
        add_header Cache-Control "no-cache" always;
    }

    location = /admin {
        return 301 /admin/;
    }

    # 用户端页面里的 ./css、./js 会请求 /user/css/、/user/js/；
    # 剩下的路径交给 SPA 兜底（hash 路由，兜底用于容错）。
    location /user/ {
        try_files $uri $uri/index.html $uri/ /user/index.html;
        add_header Cache-Control "no-cache" always;
    }

    location = /user {
        return 301 /user/;
    }

    location = /favicon.ico {
        root /var/www/sleep-schedule;
        try_files /user/favicon.svg =404;
        access_log off;
    }

    # ------------------------------------------------------- 站点入口 ---------
    location = / {
        return 302 /user/;
    }

    # 其它未匹配路径：先找真实文件，再回落到用户端首页（与后端行为一致）。
    location / {
        try_files $uri $uri/index.html $uri/ /user/index.html;
    }
}
